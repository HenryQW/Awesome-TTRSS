name: "[e2e] CI for feed fetching"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "tests/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "tests/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ttrss:e2e
          cache-from: type=gha

      - name: Run e2e
        run: tests/e2e.sh
